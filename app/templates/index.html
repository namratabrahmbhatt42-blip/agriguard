<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriGuard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');

        :root {
            --soil: #2b2118;
            --soil-light: #4a3a28;
            --leaf: #2d7a4f;
            --leaf-dark: #1f5d3a;
            --leaf-light: #e8f3ea;
            --wheat: #d9a441;
            --wheat-light: #fbf3e1;
            --sky: #4a7fa6;
            --sky-light: #e7f1f7;
            --terracotta: #c75d3a;
            --terracotta-light: #fbe9e2;
            --cream: #faf6ee;
            --paper: #fffdf8;
            --ink: #2b2118;
            --ink-soft: #6b5d4d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--cream);
            background-image:
                radial-gradient(circle at 10% 0%, rgba(217, 164, 65, 0.10), transparent 40%),
                radial-gradient(circle at 90% 10%, rgba(45, 122, 79, 0.08), transparent 45%);
            color: var(--ink);
            min-height: 100vh;
        }

        /* ---------- HEADER ---------- */
        .header {
            position: relative;
            background: linear-gradient(135deg, var(--leaf-dark) 0%, var(--leaf) 65%);
            color: var(--paper);
            padding: 22px 28px 26px;
            overflow: hidden;
            border-bottom: 3px solid var(--wheat);
        }

        .header::before {
            content: "";
            position: absolute;
            right: -40px;
            top: -60px;
            width: 220px;
            height: 220px;
            background: radial-gradient(circle, rgba(217, 164, 65, 0.35), transparent 70%);
            border-radius: 50%;
            animation: sunPulse 6s ease-in-out infinite;
        }

        @keyframes sunPulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 0.8;
            }

            50% {
                transform: scale(1.15);
                opacity: 1;
            }
        }

        .header-row {
            display: flex;
            align-items: center;
            gap: 14px;
            position: relative;
            z-index: 1;
        }

        .header-icon {
            font-size: 30px;
            display: inline-block;
            animation: sway 3.5s ease-in-out infinite;
            transform-origin: bottom center;
        }

        @keyframes sway {

            0%,
            100% {
                transform: rotate(-4deg);
            }

            50% {
                transform: rotate(5deg);
            }
        }

        .header-text h1 {
            font-family: 'Fraunces', serif;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .header-text p {
            font-size: 13px;
            opacity: 0.88;
            margin-top: 3px;
            font-weight: 400;
        }

        .header-text p#welcomeBack {
            font-weight: 600;
            opacity: 1;
        }

        /* growing wheat blades along the bottom of header */
        .wheat-row {
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 22px;
            display: flex;
            gap: 3px;
            padding: 0 20px;
            z-index: 0;
            opacity: 0.5;
        }

        .blade {
            width: 2px;
            background: var(--wheat);
            border-radius: 2px 2px 0 0;
            transform-origin: bottom;
            animation: grow 4s ease-in-out infinite;
        }

        @keyframes grow {

            0%,
            100% {
                transform: scaleY(0.7) rotate(-3deg);
            }

            50% {
                transform: scaleY(1) rotate(3deg);
            }
        }

        /* ---------- LAYOUT ---------- */
        .container {
            max-width: 820px;
            margin: 0 auto;
            padding: 22px 18px 24px;
        }

        .agent-badges {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        .badge {
            font-size: 12px;
            font-weight: 600;
            padding: 6px 13px;
            border-radius: 20px;
            border: 1.5px solid;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: var(--paper);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            cursor: default;
        }

        .badge-weather {
            color: var(--sky);
            border-color: #b9d4e6;
        }

        .badge-doctor {
            color: var(--terracotta);
            border-color: #ecbba5;
        }

        .badge-market {
            color: var(--wheat);
            border-color: #ecd49b;
        }

        .badge-general {
            color: var(--leaf);
            border-color: #abd4bb;
        }

        .badge.active {
            transform: translateY(-2px) scale(1.04);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
        }

        .badge .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
            opacity: 0.4;
        }

        .badge.active .dot {
            opacity: 1;
            animation: blink 1s ease-in-out infinite;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }
        }

        /* ---------- CHAT ---------- */
        .chat-box {
            background: var(--paper);
            border-radius: 20px;
            box-shadow: 0 1px 2px rgba(43, 33, 24, 0.04), 0 12px 32px rgba(43, 33, 24, 0.07);
            border: 1px solid rgba(43, 33, 24, 0.06);
            height: 480px;
            overflow-y: auto;
            padding: 22px;
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            scroll-behavior: smooth;
        }

        .chat-box::-webkit-scrollbar {
            width: 6px;
        }

        .chat-box::-webkit-scrollbar-thumb {
            background: #ddd2bf;
            border-radius: 10px;
        }

        .msg {
            display: flex;
            gap: 10px;
            align-items: flex-start;
            animation: sprout 0.35s ease both;
        }

        @keyframes sprout {
            from {
                opacity: 0;
                transform: translateY(10px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .msg.user {
            flex-direction: row-reverse;
        }

        .avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
            box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.04);
        }

        .avatar.bot {
            background: var(--leaf-light);
        }

        .avatar.user-av {
            background: var(--sky-light);
        }

        .bubble {
            max-width: 76%;
            padding: 13px 16px;
            font-size: 14px;
            line-height: 1.65;
            border-radius: 16px;
            position: relative;
        }

        .bubble.bot {
            background: var(--leaf-light);
            border: 1px solid #d6ead9;
            border-top-left-radius: 5px;
            color: var(--ink);
        }

        .bubble.user {
            background: linear-gradient(135deg, var(--leaf-dark), var(--leaf));
            color: var(--paper);
            border-top-right-radius: 5px;
        }

        .agent-tag {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 5px;
            opacity: 0.65;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .bubble.security {
            background: var(--terracotta-light);
            border: 1px solid #f0c4ae;
        }

        /* typing indicator = falling rain */
        .typing {
            display: flex;
            gap: 5px;
            align-items: flex-end;
            height: 14px;
            padding: 2px 0;
        }

        .typing span {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--leaf);
            animation: rain 1s ease-in-out infinite;
        }

        .typing span:nth-child(2) {
            animation-delay: 0.15s;
        }

        .typing span:nth-child(3) {
            animation-delay: 0.3s;
        }

        @keyframes rain {

            0%,
            100% {
                transform: translateY(0);
                opacity: 0.4;
            }

            50% {
                transform: translateY(6px);
                opacity: 1;
            }
        }

        .welcome {
            text-align: center;
            padding: 38px 20px;
            color: var(--ink-soft);
        }

        .welcome .icon {
            font-size: 44px;
            margin-bottom: 10px;
            display: inline-block;
            animation: sway 3.5s ease-in-out infinite;
        }

        .welcome h3 {
            font-family: 'Fraunces', serif;
            color: var(--leaf-dark);
            font-size: 19px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .welcome p {
            font-size: 13px;
            line-height: 1.7;
        }

        /* ---------- EXAMPLES ---------- */
        .examples {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }

        .example-btn {
            font-size: 12.5px;
            padding: 8px 14px;
            border-radius: 20px;
            background: var(--paper);
            border: 1.5px solid #e3d9c4;
            color: var(--soil-light);
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .example-btn:hover {
            background: var(--wheat-light);
            border-color: var(--wheat);
            transform: translateY(-1px);
        }

        /* ---------- INPUT ---------- */
        .input-row {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        #userInput {
            flex: 1;
            padding: 13px 17px;
            border-radius: 14px;
            border: 1.5px solid #e3d9c4;
            background: var(--paper);
            font-size: 14px;
            resize: none;
            outline: none;
            font-family: inherit;
            line-height: 1.5;
            max-height: 120px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        #userInput:focus {
            border-color: var(--leaf);
            box-shadow: 0 0 0 3px rgba(45, 122, 79, 0.1);
        }

        #sendBtn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--leaf-dark), var(--leaf));
            border: none;
            cursor: pointer;
            color: white;
            font-size: 19px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: transform 0.18s ease, box-shadow 0.18s ease;
            box-shadow: 0 3px 10px rgba(31, 93, 58, 0.3);
        }

        #sendBtn:hover:not(:disabled) {
            transform: scale(1.08) rotate(8deg);
        }

        #sendBtn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            transform: none;
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
            }
        }

        @media (max-width: 480px) {
            .chat-box {
                height: 60vh;
                padding: 16px;
            }

            .bubble {
                max-width: 86%;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <div class="header-row">
            <span class="header-icon">🌾</span>
            <div class="header-text">
                <h1>AgriGuard</h1>
                <p id="welcomeBack">AI-powered farming assistant — free for every farmer</p>
            </div>
        </div>
        <div class="wheat-row" id="wheatRow"></div>
    </div>

    <div class="container">
        <div class="agent-badges" id="agentBadges">
            <span class="badge badge-weather" data-agent="weather"><span class="dot"></span>🌦 Weather</span>
            <span class="badge badge-doctor" data-agent="crop_doctor"><span class="dot"></span>🌿 Crop Doctor</span>
            <span class="badge badge-market" data-agent="market"><span class="dot"></span>📊 Market</span>
            <span class="badge badge-general" data-agent="orchestrator"><span class="dot"></span>🤖 Orchestrator</span>
        </div>

        <div class="chat-box" id="chatBox">
            <div class="welcome">
                <div class="icon">🌱</div>
                <h3>Welcome to AgriGuard</h3>
                <p>Ask about weather, crop disease, or market prices.<br>आप हिंदी में भी पूछ सकते हैं।</p>
            </div>
        </div>

        <div class="examples">
            <button class="example-btn" onclick="ask('Will it rain in Ahmedabad tomorrow?')">🌧 Rain in Ahmedabad
                tomorrow?</button>
            <button class="example-btn" onclick="ask('Wheat leaves have yellow spots, what disease?')">🌿 Yellow spots
                on wheat</button>
            <button class="example-btn" onclick="ask('What is tomato price in Gujarat mandi today?')">📊 Tomato price
                Gujarat</button>
            <button class="example-btn" onclick="ask('मेरी फसल में कीड़े लग गए हैं')">🌱 मेरी फसल में कीड़े</button>
        </div>

        <div class="input-row">
            <textarea id="userInput" rows="1"
                placeholder="Ask about weather, crop disease, market prices... (English or Hindi)"></textarea>
            <button id="sendBtn" onclick="sendMessage()">➤</button>
        </div>
    </div>

    <script>
        const agentLabels = {
            weather: "🌦 Weather Agent",
            crop_doctor: "🌿 Crop Doctor Agent",
            market: "📊 Market Agent",
            orchestrator: "🤖 Orchestrator Agent",
            security: "🛡 Security Guard"
        };

        let sessionId = localStorage.getItem('agriguard_session') || null;

        // build animated wheat blades in header
        (function buildWheat() {
            const row = document.getElementById('wheatRow');
            const count = 60;
            for (let i = 0; i < count; i++) {
                const b = document.createElement('div');
                b.className = 'blade';
                const h = 8 + Math.random() * 12;
                b.style.height = h + 'px';
                b.style.animationDelay = (Math.random() * 4) + 's';
                b.style.animationDuration = (3 + Math.random() * 2) + 's';
                row.appendChild(b);
            }
        })();

        function ask(text) {
            document.getElementById("userInput").value = text;
            sendMessage();
        }

        function setActiveBadge(agent) {
            document.querySelectorAll('.badge').forEach(b => b.classList.remove('active'));
            const el = document.querySelector(`.badge[data-agent="${agent}"]`);
            if (el) el.classList.add('active');
        }

        function addMessage(text, isUser, agentUsed) {
            const box = document.getElementById("chatBox");
            const welcome = box.querySelector(".welcome");
            if (welcome) welcome.remove();
            const msg = document.createElement("div");
            msg.className = "msg" + (isUser ? " user" : "");
            if (isUser) {
                msg.innerHTML = '<div class="avatar user-av">👨‍🌾</div><div class="bubble user">' + text + "</div>";
            } else {
                const isSecurity = agentUsed === "security";
                msg.innerHTML = '<div class="avatar bot">' + (isSecurity ? '🛡️' : '🌾') + '</div><div class="bubble bot' + (isSecurity ? ' security' : '') + '">' +
                    (agentUsed ? '<div class="agent-tag">' + (agentLabels[agentUsed] || agentUsed) + "</div>" : "") +
                    text.replace(/\n/g, "<br>") + "</div>";
            }
            box.appendChild(msg);
            box.scrollTop = box.scrollHeight;
        }

        function showTyping() {
            const box = document.getElementById("chatBox");
            const t = document.createElement("div");
            t.className = "msg"; t.id = "typing";
            t.innerHTML = '<div class="avatar bot">🌾</div><div class="bubble bot"><div class="typing"><span></span><span></span><span></span></div></div>';
            box.appendChild(t);
            box.scrollTop = box.scrollHeight;
        }

        function removeTyping() {
            const t = document.getElementById("typing");
            if (t) t.remove();
        }

        async function sendMessage() {
            const input = document.getElementById("userInput");
            const btn = document.getElementById("sendBtn");
            const message = input.value.trim();
            if (!message) return;

            addMessage(message, true);
            input.value = "";
            input.style.height = "auto";
            btn.disabled = true;
            showTyping();

            try {
                const res = await fetch("/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message, session_id: sessionId })
                });
                const data = await res.json();

                if (data.session_id) {
                    sessionId = data.session_id;
                    localStorage.setItem('agriguard_session', sessionId);
                }
                if (data.farmer_name) {
                    document.getElementById('welcomeBack').textContent = `Welcome back, ${data.farmer_name}! 🌾`;
                }

                removeTyping();
                setActiveBadge(data.agent_used);
                addMessage(data.response, false, data.agent_used);
            } catch (err) {
                removeTyping();
                addMessage("Sorry, something went wrong. Please try again.", false, null);
            }
            btn.disabled = false;
            input.focus();
        }

        document.getElementById("userInput").addEventListener("keydown", function (e) {
            if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        });
        document.getElementById("userInput").addEventListener("input", function () {
            this.style.height = "auto";
            this.style.height = Math.min(this.scrollHeight, 120) + "px";
        });
    </script>
</body>

</html>
